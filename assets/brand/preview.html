<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screenstop logo</title>
<style>
  html,body { margin:0; background:#101214; }
  .strip { display:flex; align-items:flex-end; gap:20px; padding:20px; height:330px; box-sizing:border-box; }
  figure { margin:0; text-align:center; }
  figcaption { font:11px ui-sans-serif,system-ui,"Segoe UI",sans-serif; color:#79808a; margin-top:9px; }
  .tile { background:#000; padding:12px; border-radius:12px; }
  .lbl { font:11px ui-sans-serif,system-ui,"Segoe UI",sans-serif; color:#5a616b; margin:16px 20px 0; }
</style>
</head>
<body>
<div class="lbl">gradient logo — hero</div>
<div class="strip">
  <figure><div class="tile"><img src="screenstop-logo.svg" width="230"></div><figcaption>logo 230</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-logo.svg" width="96"></div><figcaption>logo 96</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-logo.svg" width="48"></div><figcaption>logo 48</figcaption></figure>
</div>
<div class="lbl">gradient icon — small sizes &amp; tray</div>
<div class="strip">
  <figure><div class="tile"><img src="screenstop-icon.svg" width="96"></div><figcaption>icon 96</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-icon.svg" width="48"></div><figcaption>48</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-icon.svg" width="32"></div><figcaption>32 tray</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-icon.svg" width="16"></div><figcaption>16</figcaption></figure>
</div>
<div class="lbl">marks — transparent, for placing on any surface</div>
<div class="strip">
  <figure><div class="tile"><img src="screenstop-mark.svg" width="88"></div><figcaption>white mark / dark</figcaption></figure>
  <figure><div class="tile"><img src="screenstop-mark-gradient.svg" width="88"></div><figcaption>gradient mark / dark</figcaption></figure>
  <figure><div style="background:#fff;padding:22px;border-radius:12px"><img src="screenstop-mark-gradient.svg" width="88"></div><figcaption>gradient mark / light</figcaption></figure>
  <figure><div style="background:#fff;padding:22px;border-radius:12px"><img src="screenstop-mark-ink.svg" width="88"></div><figcaption>ink mark / light</figcaption></figure>
</div>
</body>
</html>
